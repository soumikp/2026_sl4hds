project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!_solutions/**"
    - "!.claude/**"
    # The released HW1 landing page is a staged file: the release-hw1 workflow
    # renames it over hw1.qmd at release time. Rendering it here would publish
    # the material download links (and copy the files into docs/) early.
    - "!assignments/hw1.released.qmd"
    - "!lectures/04-regression-2/**"
    - "!lectures/05-classification-1/**"
    - "!lectures/06-classification-2/**"
    - "!lectures/07-clustering-kmeans/**"
    - "!lectures/08-clustering-gmm/**"
    - "!lectures/09-pca/**"
    - "!lectures/10-trees/**"
    - "!lectures/11-ensemble/**"
    - "!lectures/12-hyptest/**"
  resources:
    - "lectures/01-intro/slides_clean.pdf"
    - "lectures/01-intro/slides_annotated.pdf"
    - "lectures/01-intro/readings/**"
    - "lectures/02-training/slides_clean.pdf"
    - "lectures/03-regression-1/slides_clean.pdf"
    - "lectures/03-regression-1/code/data/**"

website:
  title: "BIOST 2155"
  description: "Introductory Statistical Learning for Health Sciences — Fall 2026"
  site-url: "https://soumikp.github.io/2026_sl4hds/"
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: schedule.qmd
        text: Schedule
      - href: syllabus.qmd
        text: Syllabus
      - href: assignments/index.qmd
        text: Assignments
      - href: project.qmd
        text: Project
  page-footer:
    left: "© 2026 Soumik Purkayastha"
    center: "Department of Biostatistics & Health Data Science · University of Pittsburgh"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    fig-align: center

freeze: auto
execute:
  freeze: auto
  warning: false
  message: false
